# 示例 01 · 对话框
#
# 只配了服务端地址与账号 —— 这三项就是对话 SDK 的全部配置。
# 读取时机：域名与账号由 DomainPlaneProperties 提供，密码不落盘、不回显。
server:
  port: ${CHAT_WINDOW_PORT:9530}

spring:
  application:
    name: domainplane-example-chat-window

domainplane:
  # DomainPlane 服务端地址（含协议与端口）。服务端默认端口是 9527。
  server: ${DOMAINPLANE_SERVER:http://localhost:9527}
  # 接入账号：与服务端管控台的账号同一份（不是模型 API Key）。
  username: ${DOMAINPLANE_USERNAME:domainplane}
  password: ${DOMAINPLANE_PASSWORD:domainplane}

  client:
    # 读取超时：SSE 是长连接。默认 10 分钟，长回答 + 慢模型时可能不够。
    read-timeout: ${DOMAINPLANE_READ_TIMEOUT:30m}
    # 启动期连通性校验的超时。服务端正在执行首次启动灌库时，把它调大。
    health-check-timeout: ${DOMAINPLANE_HEALTH_TIMEOUT:20s}

logging:
  level:
    # SDK 自身的日志：连接、凭证、chat/resume/stop 的发起
    com.zzkingcc.domainplane: INFO

    # 本示例自己的日志：收到的一句话、每一帧事件、本轮收尾或失败。
    # 这一行是例子最主要的观察窗口 —— "发了没反应"就看它。
    com.zzkingcc.domainplane.example.chatwindow: ${CHAT_WINDOW_LOG_LEVEL:INFO}