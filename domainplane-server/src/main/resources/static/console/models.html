<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型设置 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <div class="head-line">
                    <div><h2>模型设置</h2></div>
                    <button class="btn btn-sm btn-outline-primary" id="openConnBtn">预设配置信息</button>
                    <button class="btn btn-sm btn-outline-primary" id="addModelBtn">+ 添加模型</button>
                </div>
            </div>
        </div>
        <div class="page-body">

            <!-- ============ 分段一：向量模型（全局唯一一个，全部域共享） ============ -->
            <div class="seg">
                <h3>向量模型</h3>
                <span class="seg-note">全局只能启用一个，所有域共用；知识库的灌库与向量检索都走它</span>
                <span class="spacer"></span>
                <span class="count-badge" id="embeddingCount"
                      title="已登记的向量档案数（含尚未选用的，它们在下方的选择框里）">—</span>
            </div>
            <div id="embeddingList">
                <div class="dp-card perm-none">加载中…</div>
            </div>

            <!-- ============ 分段二：模型（除当前向量模型外的全部档案） ============
                 刻意不叫「对话模型」：识别把档案分成 chat / embedding / images / tts / rerank …
                 好几类，只列 chat 会让生图、语音这类档案存进去之后在页面上彻底消失
                 （看不到、测不了、也删不掉）。这里除当前占着向量槽位的那一个之外全部列出，
                 对话模型在其中按域绑定使用。 -->
            <div class="seg">
                <h3>模型</h3>
                <span class="seg-note">除向量模型外的全部档案；对话模型要在「域空间」页绑给域才能被调用</span>
                <span class="spacer"></span>
                <span class="count-badge" id="modelCount"
                      title="本段列出的档案数（不参与域绑定的生图 / 语音等类型也计在内）">—</span>
            </div>
            <div id="modelList">
                <div class="dp-card perm-none">加载中…</div>
            </div>

            <!-- ============ 添加模型：遮罩层弹窗 ============
                 只有一种表单：登记一份新档案。类型不由用户声明（下拉已移除），
                 保存时由服务端读提供商的模型清单（GET /models，不发推理请求、不花 token）：
                 读到的端点族决定它归入「模型」段还是「向量模型」段，读到的模态就是卡片上那两行；
                 清单不给这些字段（OpenAI / DeepSeek 官方都是标准规范形态）时如实留空，
                 卡片标「未声明类型」。向量模型不是独立表单，它是「被选中的那份 embedding 档案」。

                 弹窗只负责"建"：建好之后，温度 / 单次最大输出 / 自定义参数都在卡片上就地改，
                 「是否回写思考内容」是卡片头部的开关（见 thinkSwitch），都不必再弹这个窗。
                 新档案的思考回写默认关闭。 -->
        </div>
        <div class="modal-mask" id="profileModal" hidden>
            <div class="modal-panel" role="dialog" aria-modal="true"
                 aria-labelledby="profileModalTitle">
                <div class="modal-head">
                    <h3 id="profileModalTitle">添加模型</h3>
                    <span class="spacer"></span>
                    <button type="button" class="modal-close" id="profileModalClose"
                            aria-label="关闭">×</button>
                </div>
                <div class="field" id="fPreset">
                    <label>预设配置</label>
                    <div class="combo" id="pfPresetCombo">
                        <input class="form-control" id="pfPreset" placeholder="选择常见服务商…"
                               autocomplete="off" role="combobox" aria-expanded="false"
                               aria-controls="pfPresetMenu">
                        <button type="button" class="combo-btn" id="pfPresetBtn"
                                title="从内置预设选择" aria-label="展开内置预设">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="combo-menu" id="pfPresetMenu" role="listbox"
                             aria-label="内置预设" style="display:none;"></div>
                    </div>
                </div>

                <div class="field" id="fBaseUrl">
                    <label>服务商地址（baseUrl）</label>
                    <input id="pfBaseUrl" class="mono form-control" placeholder="https://api.example.com/v1"
                           autocomplete="off">
                    <!-- 预设 / 连接回填后的状态提示（readSay 写这里） -->
                    <div class="help" id="readResult" style="white-space: pre-wrap; margin-top:10px;"></div>
                </div>

                <div class="field">
                    <label>API Key</label>
                    <input id="pfApiKey" type="password" class="mono form-control" placeholder="必填"
                           autocomplete="off">
                </div>

                <div class="field">
                    <label>模型名</label>
                    <div class="combo" id="pfModelCombo">
                        <input id="pfModelName" class="mono form-control" placeholder="gpt-4o"
                               autocomplete="off" role="combobox" aria-expanded="false"
                               aria-controls="pfModelMenu" aria-autocomplete="list">
                        <button type="button" class="combo-btn" id="pfModelBtn"
                                title="从服务商获取模型列表" aria-label="展开模型列表">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                        <div class="combo-menu" id="pfModelMenu" role="listbox"
                             aria-label="模型候选" style="display:none;"></div>
                    </div>
                </div>

                <!-- ── 调优参数（对话档案）──
                     标准字段（温度 / 单次最大输出）落在档案的老字段上，注入走 builder 的 setter；
                     自定义参数是一个 JSON 对象，键名用服务商文档里的字段名，键值原样拼进请求体。
                     两者都可留空：留空 = 不发送，由服务商默认决定。
                     服务端复核走 CustomParamsGate（黑名单 / 形状 / 量 / 标准键冲突），
                     它拒的只有"归平台管的键"，不判断厂商取值域对不对。 -->
                <div class="field">
                    <label>温度</label>
                    <input id="pfTemperature" type="number" class="mono form-control"
                           min="0" max="2" step="0.1" placeholder="服务商默认">
                </div>

                <div class="field">
                    <label>单次最大输出（token）</label>
                    <input id="pfMaxTokens" type="number" class="mono form-control"
                           min="1" step="1" placeholder="不限">
                </div>

                <div class="field">
                    <label>自定义参数（JSON）</label>
                    <textarea id="pfParamsJson" class="mono form-control" rows="3" spellcheck="false"
                              placeholder='{"reasoning_effort": "high"}'></textarea>
                </div>

                <div id="profileResult" class="result"></div>

                <footer class="card-foot">
                    <button class="btn btn-outline-secondary" id="resetProfileFormBtn">清空表单</button>
                    <button class="btn btn-outline-primary" id="saveProfileBtn">保存</button>
                </footer>
            </div>
        </div>

        <!-- ============ 预设配置信息：自定义配置项的维护弹窗 ============
             与「添加模型」不是同一个弹窗，但刻意用同一套遮罩层与表单样式：
             两处都是"往受保护配置里写一份凭据"，视觉与操作习惯应当一致。

             一条自定义配置 = 名称 + 服务商地址 +（可选）密钥。三项合成一条而不是拆开：
             换服务商时地址 / 密钥从来一起变，合成一条才能一次填好模型表单，
             也避免配出"地址是 A、密钥是 B"的错搭。

             它只是**快捷填充**，不是引用关系，选中后把三项填进模型表单，
             档案保存时仍各自保存明文副本。因此删除一条**不会**影响任何已保存档案，
             这一点在列表下方与删除后的提示里都写明。 -->
        <div class="modal-mask" id="connModal" hidden>
            <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="connModalTitle">
                <div class="modal-head">
                    <h3 id="connModalTitle">预设配置信息</h3>
                    <span class="spacer"></span>
                    <button type="button" class="modal-close" id="connModalClose" aria-label="关闭">×</button>
                </div>

                <div class="field">
                    <label>名称（与内置配置项合起来唯一）</label>
                    <input class="form-control" id="cnName" placeholder="如：硅基流动-主 / 内网 vLLM / openrouter-免费档">
                </div>
                <div class="field">
                    <label>服务商地址（baseUrl）</label>
                    <input id="cnBaseUrl" class="mono form-control" placeholder="https://api.example.com/v1" autocomplete="off">
                </div>
                <div class="field">
                    <label>API Key（可空）</label>
                    <input id="cnApiKey" type="password" class="mono form-control" placeholder="自建端点可留空；模型档案侧仍需一个非空占位" autocomplete="off">
                </div>

                <footer class="card-foot">
                    <button class="btn btn-outline-secondary" id="cnClearBtn">清空</button>
                    <button class="btn btn-outline-primary" id="cnAddBtn">添加</button>
                </footer>

                <div id="cnResult" class="result"></div>
                <div id="cnList"></div>
            </div>
        </div>
    </main>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-models.js"></script>
</body>
</html>
