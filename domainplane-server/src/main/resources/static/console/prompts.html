<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词设定 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <h2>提示词设定</h2>
            </div>
        </div>
        <div class="page-body dp-prompts">

            <div id="orphanBox" class="orphan-box" style="display:none;"></div>

            <!-- 统计行：四个数都从 /admin/prompts 的返回里现场算，零新请求。
                 「缺提示词 / 孤儿条目」是这页的治理指标——前者影响体验，后者是无效配置。 -->
            <div class="row row-cards row-deck">
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-blue">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 4v-4H6a2 2 0 0 1-2-2z"/><path d="M8 8.5h8M8 11.5h5"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">域总数</div>
                                <div class="dp-stat-value" id="statDomains">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-green">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">已配置</div>
                                <div class="dp-stat-value" id="statConfigured">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-purple">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">缺提示词</div>
                                <div class="dp-stat-value" id="statMissing">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-pink">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">孤儿条目</div>
                                <div class="dp-stat-value" id="statOrphans">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dp-prompts-split">
                <section class="card dp-panel">
                    <div class="dp-panel-head">
                        <span class="dp-panel-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                        </span>
                        <div class="dp-panel-title"><h3>域</h3></div>
                        <span class="spacer"></span>
                        <div class="dp-head-actions">
                            <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">重新读取</button>
                        </div>
                    </div>
                    <div class="dp-panel-body">
                        <div class="dp-domain-scroll" id="domainList"></div>
                    </div>
                    <div class="dp-panel-foot">
                        <details class="disclose">
                            <summary>可见工具与提示词的关系</summary>
                            <div class="disclose-body">
                                可见工具 = 该域真实能用的工具集（声明留空或挂在根域的工具对全树可见；
                                挂在父域的工具，其所有后代域都能用）。
                                <b>提示词不决定工具可见性</b>：就算某个域一个字都没配，它对工具的限制照样生效，缺提示词只是体验降级。
                            </div>
                        </details>
                    </div>
                </section>
                <section class="card dp-panel">
                    <div class="dp-panel-head">
                        <span class="dp-panel-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                        </span>
                        <div class="dp-panel-title">
                            <h3 class="mono" id="edDomain">—</h3>
                            <div class="dp-panel-sub" id="edTools"></div>
                        </div>
                        <span class="spacer"></span>
                        <span class="dirty" id="dirtyFlag" style="display:none;">● 有未保存修改</span>
                        <div class="dp-head-actions">
                            <button class="btn btn-primary btn-sm" id="saveBtn" disabled>保存并生效</button>
                        </div>
                    </div>
                    <div class="dp-panel-body">
                        <div class="dp-editor-empty" id="editorEmpty">
                            <span class="ee-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
                            <span>从左侧选择一个域开始编辑</span>
                        </div>
                        <div id="editorForm" style="display:none;">
                            <textarea class="form-control" id="domainText" placeholder="该域自己的片段，例如口吻、该场景下何时调用哪类能力。留空 = 只用祖先链上的内容。"></textarea>
                            <div class="meta">
                                <span>字数 <b id="domainLen">0</b></span>
                                <span class="card-note" id="edChain"></span>
                            </div>
                            <div class="dp-preview-head">生效提示词预览 <span class="sub">沿域链从根域拼接</span></div>
                            <pre class="preview" id="preview"></pre>
                            <div class="result" id="saveResult"></div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-prompts.js"></script>
</body>
</html>
