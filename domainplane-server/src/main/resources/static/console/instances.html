<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具调用 / 熔断 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
    <style>
        .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
        /* nowrap + flex:0 0 auto：这个 label 是"复选框 + 中文"的嵌套 flex 容器，中文可在任意
           两字之间断行；同一行的按钮已 nowrap，行一紧收缩就全压到这段文字上，会被挤成竖排。
           钉住文字宽度，行放不下时由 .toolbar 的 flex-wrap 换行。 */
        .toolbar label.auto {
            display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted);
            white-space: nowrap; flex: 0 0 auto;
        }
        .empty { font-size: 13px; color: var(--muted); line-height: 1.8; padding: 6px 0 2px; }
        .empty code { background: #f1f5f9; border-radius: 4px; padding: 1px 5px; }
        td .mono { font-size: 12px; }
        .tools-cell { max-width: 340px; }
        .tools-cell .tag { margin: 0 4px 4px 0; }
        .muted { color: var(--muted); }

        /* ---------- 工具目录：与实例表同页，但 DOM 完全独立 ----------
           轮询只重绘实例表。两块若共用一次 innerHTML，编辑到一半的说明会被 10 秒刷新清空。 */
        .tool-dir-card { margin-bottom: 18px; }
        .tool-filters input.form-control,
        .tool-filters select.form-control {
            width: auto; height: auto; min-height: 30px; padding: 5px 9px;
            font-size: 12.5px; line-height: 18px;
        }
        .tool-filters select.form-control { min-width: 120px; }
        .tool-filters input.form-control { flex: 1 1 220px; max-width: 320px; }
        .tool-table td { vertical-align: top; }
        .tool-table .tool-name { font-weight: 600; font-size: 12.5px; }
        .tool-table .tool-desc {
            max-width: 400px; color: var(--muted); font-size: 12.5px; line-height: 1.55;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .kind-tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; }
        .kind-local { background: #e6f1fb; color: #185fa5; }
        .kind-remote { background: #f1efe8; color: #5f5e5a; }
        .kind-mcp { background: #eeedfe; color: #534ab7; }
        .tool-detail-row > td {
            background: var(--tblr-bg-surface-secondary, #f7f8fa); padding: 14px 18px;
        }
        .tool-detail { max-width: 920px; }
        .tool-detail-head { font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
        .tool-detail-head:first-child { margin-top: 0; }
        .tool-desc-input, .tool-detail .param-row input {
            font-size: 12.5px; line-height: 1.6; background: #fff;
        }
        .tool-desc-input { resize: vertical; min-height: 66px; }
        .tool-detail .param-row input { width: 100%; }
        .baseline-line {
            font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5;
            word-break: break-word;
        }
        .param-row { padding: 7px 0; border-bottom: 1px dashed var(--border); }
        .param-label { font-size: 12px; margin-bottom: 4px; }
        .param-label code { background: #f1f5f9; border-radius: 3px; padding: 1px 5px; }
        .tool-detail-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .tool-detail-status { flex: 1 1 200px; font-size: 12px; color: var(--muted); line-height: 1.5; }
        .tool-detail-status.ok { color: var(--green); }
        .tool-detail-status.err { color: var(--red); }
        .drift-tag { margin-left: 8px; font-size: 11.5px; color: #a32d2d; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <h2>工具调用 / 熔断</h2>
            </div>
        </div>
        <div class="page-body dp-instances">

            <!-- 统计卡与概览同构（card-sm + dp-stat）：图标 + 标签 + 大数字 + 补充小字。
                 补充小字（note）不是装饰——「几个已熔断 / 清理中 / 强制下线」是这页的
                 运营关键信息，出状况时第一眼要能看到。 -->
            <div class="row row-cards row-deck">
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-blue">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">在线实例</div>
                                <div class="dp-stat-value" id="statOnline">—</div>
                                <div class="dp-stat-note" id="statOnlineNote"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-purple">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">远程副本</div>
                                <div class="dp-stat-value" id="statReplica">—</div>
                                <div class="dp-stat-note" id="statReplicaNote"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-green">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 5.6L4 16.6a1.8 1.8 0 0 0 2.5 2.5l4.7-4.7a4.5 4.5 0 0 0 5.6-6l-3.1 3.1-2.4-.6-.6-2.4z"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">注册表工具</div>
                                <div class="dp-stat-value" id="statTools">—</div>
                                <div class="dp-stat-note" id="statToolsNote"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-pink">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">判死超时窗</div>
                                <div class="dp-stat-value" id="statTimeout">—</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 工具目录：内置可改说明、远程 / MCP 只读。展开区与实例表分属不同 tbody，
                 轮询不会碰它。 -->
            <div class="dp-card tool-dir-card">
                <div class="card-head">
                    <h2>工具目录</h2>
                    <div class="spacer"></div>
                    <span class="card-note" id="toolSummary"></span>
                </div>

                <div class="toolbar tool-filters">
                    <select id="toolKind" class="form-control">
                        <option value="">全部来源</option>
                        <option value="LOCAL">内置</option>
                        <option value="REMOTE">远程实例</option>
                        <option value="MCP">MCP</option>
                    </select>
                    <input id="toolSearch" class="form-control" placeholder="搜索工具名 / 说明">
                    <button class="btn btn-sm btn-outline-secondary" id="toolRefreshBtn" type="button">重新读取</button>
                    <span class="card-note" id="toolState"></span>
                </div>

                <div class="table-wrap" id="toolTableWrap">
                    <table class="table tool-table">
                        <thead>
                        <tr>
                            <th>工具</th>
                            <th>来源</th>
                            <th>说明</th>
                            <th>参数</th>
                            <th>域</th>
                            <th>副本</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="toolBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="dp-card">
                <div class="card-head">
                    <h2>实例清单</h2>
                    <div class="spacer"></div>
                    <span class="card-note" id="updatedAt"></span>
                </div>

                <div class="toolbar">
                    <button class="btn btn-sm btn-outline-secondary" id="refreshBtn" type="button">重新读取</button>
                    <label class="auto">
                        <input type="checkbox" id="autoRefresh" checked>
                        每 10 秒自动刷新
                    </label>
                    <span class="card-note" id="loadState"></span>
                </div>

                <div class="table-wrap" id="tableWrap" style="display:none;">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>实例</th>
                            <th>调用地址</th>
                            <th>状态</th>
                            <th>最后心跳</th>
                            <th>工具</th>
                            <th>manifest</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="instanceBody"></tbody>
                    </table>
                </div>

                <div class="empty" id="emptyHint" style="display:none;">
                    当前没有在线实例。<br>
                    实例侧需周期向 <code>POST /api/agent/tools/register</code> 发送整包 manifest（注册与心跳合一）；
                    服务端重启后在线表清空，待 SDK 自动重连即恢复，期间带域的请求会报 10004，属预期。
                </div>
            </div>
        </div>
    </main>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-instances.js?v=1"></script>
</body>
</html>
