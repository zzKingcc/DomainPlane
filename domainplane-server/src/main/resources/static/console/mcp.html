<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 连接 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
    <style>
        .mcp-icon { width: 17px; height: 17px; flex: 0 0 17px; color: var(--primary); }
        .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12.5px; margin-top: 8px; }
        .kv .k { color: var(--muted); }
        .kv .v { word-break: break-all; font-family: ui-monospace, Consolas, monospace; }
        .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .pick-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--card); }
        .pick-card:hover { border-color: var(--primary); }
        .pick-card.on { border-color: var(--primary); background: var(--primary-dim); }
        .pick-card .pc-name { font-size: 13px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
            background: var(--bg); color: var(--text); font-size: 13px; box-sizing: border-box;
            font-family: ui-monospace, Consolas, monospace;
        }
        .form-row textarea { min-height: 64px; resize: vertical; }
        .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tag.ready { color: #16a34a; border-color: #16a34a; }
        .tag.failed { color: var(--red); border-color: var(--red); }
        .tag.off { color: var(--muted); }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-head">
            <div class="head-line">
                <div>
                    <h2>MCP 连接</h2>
                    <p>对接外部 MCP server（Model Context Protocol）。一个连接 = 一个 MCP 实例，其工具经命名规范化后注册进平台，
                       再按"域绑定"授权给指定域可见。v1 实装 Streamable HTTP 传输。</p>
                </div>
                <span class="count-badge" id="connCount">—</span>
            </div>
            <div class="actions">
                <button class="btn btn-primary" id="createBtn">新增连接</button>
                <button class="ghost btn btn-sm btn-outline-primary" id="refreshBtn">重新读取</button>
            </div>
        </div>

        <div id="connList"></div>
    </main>
</div>

<!-- ===== 新增 / 编辑 遮罩层 ===== -->
<div class="modal-mask" id="editModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" style="max-width:620px;">
        <div class="modal-head">
            <h3 id="editTitle">新增 MCP 连接</h3>
            <span class="spacer"></span>
            <button class="ghost btn btn-sm btn-outline-primary" id="editClose">关闭</button>
        </div>
        <div class="modal-body" style="padding:6px 2px;">
            <div class="form-row">
                <label>连接名（唯一，工具命名空间前缀；禁止连续双下划线）</label>
                <input class="form-control" id="f_name" placeholder="如 qqmail">
            </div>
            <div class="form-row">
                <label>MCP server 地址（Streamable HTTP 端点）</label>
                <input class="form-control" id="f_url" placeholder="https://api.mail.qq.com/mcp">
            </div>
            <div class="form-2">
                <div class="form-row">
                    <label>传输类型</label>
                    <select class="form-select" id="f_transport">
                        <option value="STREAMABLE_HTTP">STREAMABLE_HTTP（2025-03-26，已实装）</option>
                        <option value="LEGACY_SSE">LEGACY_SSE（2024-11-05，预留）</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>审批策略</label>
                    <select class="form-select" id="f_approval">
                        <option value="ALL">ALL（全部需人工批准，推荐默认）</option>
                        <option value="DESTRUCTIVE_ONLY">DESTRUCTIVE_ONLY（仅破坏性需批准）</option>
                        <option value="READ_ONLY_FREE">READ_ONLY_FREE（只读免批准）</option>
                        <option value="NONE">NONE（全部免批准，仅内网可信）</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <label>自定义请求头（JSON 对象，如鉴权；不回显，留空=保持不变）</label>
                <textarea class="form-control" id="f_headers" placeholder='{"Authorization":"Bearer xxxx"}'></textarea>
            </div>
            <div class="form-row">
                <label>OAuth 客户端（服务器要求授权时才需要；动态注册被拒时填预登记的 client_id）</label>
                <input class="form-control" id="f_oauth_cid" placeholder="client_id（留空=动态注册）">
            </div>
            <div class="form-row">
                <label>client_secret（不回显，留空=保持不变；公共客户端可留空）</label>
                <input class="form-control" id="f_oauth_secret" type="password" placeholder="••••••（已配置则留空保持不变）">
            </div>
            <div class="form-2">
                <div class="form-row">
                    <label>注册用 client 名称（留空=WorkBuddy）</label>
                    <input class="form-control" id="f_oauth_cname" placeholder="WorkBuddy">
                </div>
                <div class="form-row">
                    <label>授权范围 scope（留空=服务器默认）</label>
                    <input class="form-control" id="f_oauth_scope" placeholder="如 mail.read">
                </div>
            </div>
            <div class="form-row">
                <label>固定回调地址 redirect_uri（留空=用当前管控台地址；服务商只认固定回调时才填）</label>
                <input class="form-control" id="f_oauth_redirect" placeholder="https://你的域名/admin/mcp-connections/xxx/oauth/callback">
            </div>
            <div class="form-2">
                <div class="form-row">
                    <label>单次调用超时（毫秒，默认 30000）</label>
                    <input class="form-control" id="f_timeout" type="number" placeholder="30000">
                </div>
                <div class="form-row">
                    <label>工具白名单（逗号分隔原始工具名；留空=全部）</label>
                    <input class="form-control" id="f_allow" placeholder="GetMe,ListMessages">
                </div>
            </div>
            <div class="form-row">
                <label>备注</label>
                <input class="form-control" id="f_remark" placeholder="可选">
            </div>
            <div class="form-row">
                <label><input type="checkbox" id="f_enabled" checked style="width:auto;margin-right:6px;">启用（关=不连、不注册）</label>
            </div>
        </div>
        <footer class="card-foot">
            <button class="btn btn-primary" id="editSaveBtn">保存</button>
            <button class="ghost btn btn-sm btn-outline-primary" id="editClearBtn">重置</button>
        </footer>
    </div>
</div>

<!-- ===== 绑定域 遮罩层 ===== -->
<div class="modal-mask" id="bindModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" style="max-width:680px;">
        <div class="modal-head">
            <h3>配置 <span class="mono" id="bindConnName"></span> 的域绑定</h3>
            <span class="spacer"></span>
            <button class="ghost btn btn-sm btn-outline-primary" id="bindClose">关闭</button>
        </div>
        <div id="bindCardList" class="pick-grid" style="margin-top:10px;"></div>
        <div id="bindEmpty" class="perm-none" style="margin-top:10px; display:none;"></div>
        <footer class="card-foot">
            <button class="btn btn-primary" id="bindSaveBtn">保存绑定</button>
            <button class="ghost btn btn-sm btn-outline-primary" id="bindClearBtn">全部解绑</button>
        </footer>
    </div>
</div>

<!-- ===== 工具目录 遮罩层 ===== -->
<div class="modal-mask" id="toolsModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" style="max-width:720px;">
        <div class="modal-head">
            <h3><span class="mono" id="toolsConnName"></span> 的工具目录</h3>
            <span class="spacer"></span>
            <button class="ghost btn btn-sm btn-outline-primary" id="toolsClose">关闭</button>
        </div>
        <div id="toolsBody" style="margin-top:10px;"></div>
    </div>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-mcp.js"></script>
</body>
</html>
