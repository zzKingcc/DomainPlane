<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 连接 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <div class="head-line">
                    <div><h2>MCP 连接</h2></div>
                </div>
                <div class="actions">
                    <label class="dp-mcp-auto"><input type="checkbox" id="autoRefresh" checked>自动刷新</label>
                    <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">重新读取</button>
                    <button class="btn btn-sm btn-outline-primary" id="createBtn">新增连接</button>
                </div>
            </div>
        </div>
        <div class="page-body dp-mcp">

            <div class="dp-mcp-stats">
                <div class="card card-sm dp-stat">
                    <div class="card-body dp-stat-body">
                        <div class="dp-stat-info">
                            <div class="dp-stat-label">连接总数</div>
                            <div class="dp-stat-value" id="statConns">—</div>
                        </div>
                    </div>
                </div>
                <div class="card card-sm dp-stat">
                    <div class="card-body dp-stat-body">
                        <div class="dp-stat-info">
                            <div class="dp-stat-label">已就绪</div>
                            <div class="dp-stat-value" id="statReady">—</div>
                        </div>
                    </div>
                </div>
                <div class="card card-sm dp-stat">
                    <div class="card-body dp-stat-body">
                        <div class="dp-stat-info">
                            <div class="dp-stat-label">需授权</div>
                            <div class="dp-stat-value" id="statNeedsAuth">—</div>
                        </div>
                    </div>
                </div>
                <div class="card card-sm dp-stat">
                    <div class="card-body dp-stat-body">
                        <div class="dp-stat-info">
                            <div class="dp-stat-label">连接失败</div>
                            <div class="dp-stat-value" id="statFailed">—</div>
                        </div>
                    </div>
                </div>
                <div class="card card-sm dp-stat">
                    <div class="card-body dp-stat-body">
                        <div class="dp-stat-info">
                            <div class="dp-stat-label">已暴露工具</div>
                            <div class="dp-stat-value" id="statTools">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dp-mcp-workbench">
                <section class="card dp-mcp-list">
                    <div class="dp-mcp-list-head">
                        <input class="form-control" id="connSearch" placeholder="搜索连接名 / 地址">
                        <select class="form-select" id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="READY">已就绪</option>
                            <option value="NEEDS_AUTH">需授权</option>
                            <option value="FAILED">连接失败</option>
                            <option value="DISCONNECTED">未连接</option>
                            <option value="OFF">已禁用</option>
                        </select>
                    </div>
                    <div id="connList" class="dp-mcp-items"></div>
                    <div class="dp-mcp-sync" id="syncHint"></div>
                </section>

                <section class="card dp-mcp-detail">
                    <div id="detailEmpty" class="dp-mcp-empty" hidden>还没有任何 MCP 连接。点「新增连接」接入一个外部 MCP server。</div>
                    <div id="detailBody" hidden>
                        <div class="dp-mcp-statusbar" id="statusBar"></div>
                        <div class="dp-mcp-tabs" id="tabBar">
                            <button class="dp-mcp-tab on" type="button" data-tab="overview">概览</button>
                            <button class="dp-mcp-tab" type="button" data-tab="tools">工具</button>
                            <button class="dp-mcp-tab" type="button" data-tab="auth">授权</button>
                            <button class="dp-mcp-tab" type="button" data-tab="bind">绑定</button>
                        </div>
                        <div class="dp-mcp-pane" id="paneOverview"></div>
                        <div class="dp-mcp-pane" id="paneTools" hidden></div>
                        <div class="dp-mcp-pane" id="paneAuth" hidden></div>
                        <div class="dp-mcp-pane" id="paneBind" hidden></div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<div class="modal-mask" id="editModal" hidden>
    <div class="modal-panel dp-mcp-drawer" role="dialog" aria-modal="true">
        <div class="modal-head">
            <h3 id="editTitle">新增 MCP 连接</h3>
            <span class="spacer"></span>
            <button class="btn btn-outline-secondary" id="editClose">关闭</button>
        </div>
        <div class="modal-body">
            <div class="dp-mcp-group">
                <h4>基础</h4>
                <div class="f-row">
                    <label>连接名（唯一，工具命名空间前缀；禁止连续双下划线）</label>
                    <input class="form-control" id="f_name" placeholder="如 qqmail">
                </div>
                <div class="f-row">
                    <label>MCP server 地址（Streamable HTTP 端点）</label>
                    <input class="form-control" id="f_url" placeholder="https://api.mail.qq.com/mcp">
                </div>
                <div class="f-row">
                    <label>备注</label>
                    <input class="form-control" id="f_remark" placeholder="可选">
                </div>
                <div class="f-row">
                    <label><input type="checkbox" id="f_enabled" checked>启用</label>
                </div>
            </div>

            <div class="dp-mcp-group">
                <h4>传输与鉴权</h4>
                <div class="f-2">
                    <div class="f-row">
                        <label>传输类型</label>
                        <select class="form-select" id="f_transport">
                            <option value="STREAMABLE_HTTP">STREAMABLE_HTTP（2025-03-26，已实装）</option>
                            <option value="LEGACY_SSE">LEGACY_SSE（2024-11-05，已实装）</option>
                        </select>
                    </div>
                    <div class="f-row">
                        <label>单次调用超时（毫秒）</label>
                        <input class="form-control" id="f_timeout" type="number" placeholder="30000">
                    </div>
                </div>
                <div class="f-row">
                    <label>自定义请求头（JSON 对象；留空 = 保持不变）</label>
                    <textarea class="form-control" id="f_headers" placeholder='{"Authorization":"Bearer xxxx"}'></textarea>
                </div>
                <div class="dp-mcp-keystate" id="headerState"></div>
            </div>

            <div class="dp-mcp-group">
                <h4>治理</h4>
                <div class="f-row">
                    <label>审批策略</label>
                    <select class="form-select" id="f_approval">
                        <option value="ALL">ALL（全部需人工批准，推荐默认）</option>
                        <option value="DESTRUCTIVE_ONLY">DESTRUCTIVE_ONLY（仅破坏性需批准）</option>
                        <option value="READ_ONLY_FREE">READ_ONLY_FREE（只读免批准）</option>
                        <option value="NONE">NONE（全部免批准，仅内网可信）</option>
                    </select>
                </div>
                <div class="f-row">
                    <label>工具白名单（留空 = 全部开放）</label>
                    <div id="allowTools" class="dp-mcp-allow"></div>
                </div>
            </div>

            <details class="dp-mcp-group dp-mcp-advanced">
                <summary>高级 · OAuth 客户端</summary>
                <div class="f-row">
                    <label>client_id（留空 = 动态注册）</label>
                    <input class="form-control" id="f_oauth_cid" placeholder="client_id">
                </div>
                <div class="f-row">
                    <label>client_secret（留空 = 保持不变）</label>
                    <input class="form-control" id="f_oauth_secret" type="password" placeholder="••••••">
                </div>
                <div class="f-2">
                    <div class="f-row">
                        <label>注册用 client 名称</label>
                        <input class="form-control" id="f_oauth_cname" placeholder="WorkBuddy">
                    </div>
                    <div class="f-row">
                        <label>授权范围 scope</label>
                        <input class="form-control" id="f_oauth_scope" placeholder="如 mail.read">
                    </div>
                </div>
                <div class="f-row">
                    <label>固定回调地址 redirect_uri</label>
                    <input class="form-control" id="f_oauth_redirect" placeholder="https://你的域名/admin/mcp-connections/xxx/oauth/callback">
                </div>
            </details>
        </div>
        <footer class="card-foot">
            <button class="btn btn-outline-primary" id="editSaveBtn">保存</button>
            <button class="btn btn-outline-secondary" id="editClearBtn">重置</button>
        </footer>
    </div>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-mcp.js"></script>
</body>
</html>
