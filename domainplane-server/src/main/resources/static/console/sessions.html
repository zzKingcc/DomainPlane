<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会话档案 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <h2>会话档案</h2>
            </div>
        </div>
        <div class="page-body dp-sessions">

            <div class="card dp-panel">
                <div class="card-body">
                    <div class="dp-sessions-query">
                        <input id="sessionIdInput" type="text" placeholder="会话 ID" autocomplete="off">
                        <input id="domainInput" type="text" placeholder="域（选填）" autocomplete="off">
                        <button class="btn" id="btnQuery" type="button">查看</button>
                        <button class="btn" id="btnExport" type="button">导出副本</button>
                        <button class="btn btn-outline-danger" id="btnClear" type="button">清空会话</button>
                    </div>
                    <div class="dp-sessions-facts" id="sessionFacts"></div>
                </div>
            </div>

            <div class="card dp-panel">
                <div class="card-body">
                    <h3 class="card-title">会话列表</h3>
                    <div class="dp-sessions-filter">
                        <label for="domainFilter">域</label>
                        <select id="domainFilter" class="form-control"></select>
                        <label for="sessionLimit">条数</label>
                        <select id="sessionLimit" class="form-control">
                            <option value="20">20</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                        </select>
                        <button class="btn btn-sm" id="btnRefreshSessions" type="button">刷新</button>
                        <span class="dp-sessions-count" id="sessionCount"></span>
                    </div>
                    <div class="dp-sessions-table-wrap">
                        <table class="table dp-sessions-table">
                            <thead>
                            <tr>
                                <th>会话 ID</th>
                                <th>域</th>
                                <th>轮数</th>
                                <th>记忆条数</th>
                                <th>向量轮数</th>
                                <th>装配清单</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="sessionTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="dp-sessions-split">
                <div class="card dp-panel">
                    <div class="card-body">
                        <h3 class="card-title">轮次</h3>
                        <div id="turnList" class="dp-sessions-turns"></div>
                        <div class="dp-sessions-pager">
                            <button class="btn btn-sm" id="btnPrevPage" type="button">上一页</button>
                            <span id="pageInfo"></span>
                            <button class="btn btn-sm" id="btnNextPage" type="button">下一页</button>
                        </div>
                    </div>
                </div>

                <div class="card dp-panel">
                    <div class="card-body" id="turnDetail"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-sessions.js"></script>
</body>
</html>
