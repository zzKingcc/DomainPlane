<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域空间 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
    <style>
        .dom-icon { width: 17px; height: 17px; flex: 0 0 17px; color: var(--primary); }
        .card-head h2.mono { font-family: ui-monospace, Consolas, monospace; }

        /* 遮罩层里的模型卡片：点一下即选中/取消 */
        .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .pick-card {
            border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
            cursor: pointer; background: var(--card);
        }
        .pick-card:hover { border-color: var(--primary); }
        .pick-card.on { border-color: var(--primary); background: var(--primary-dim); }
        .pick-card .pc-name { font-size: 13.5px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
        .pick-card .pc-note { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
        .pick-card .pc-tags { margin-top: 8px; }

        .tool-tags { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-head">
            <div class="head-line">
                <div>
                    <h2>域空间</h2>
                    <p>一个域一张卡片：配置可调用模型与可见工具。域分两种角色：<b>可调用单元</b>（能作为入口）与<b>装配节点</b>（只把工具 / 提示词 / 模型 / 知识传给后代）。新建域默认无可调用模型。</p>
                </div>
                <span class="count-badge" id="domainCount">—</span>
            </div>
            <div class="actions">
                <input class="form-control" type="text" id="newDomain" placeholder="完整路径域，如 default.customer-service"
                       style="width:240px; font-family:ui-monospace,Consolas,monospace;">
                <!-- nowrap 必须写在这里：label 是 inline-flex，里面的「可调用」是匿名 flex 项，
                     中文可在任意两字间断行，行内空间一紧就会被挤成竖排三个字；
                     flex:0 0 auto 同时禁止这一行把 label 压扁 -->
                <label class="card-note"
                       style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap; flex:0 0 auto;"
                       title="勾选=可调用单元（能作为入口）；不勾选=只做装配，供后代继承工具 / 提示词 / 模型 / 知识">
                    <input type="checkbox" id="newDomainCallable" checked> 可调用
                </label>
                <button class="btn btn-primary" id="createDomainBtn">新建域</button>
                <button class="ghost btn btn-sm btn-outline-primary" id="refreshBtn">重新读取</button>
            </div>
        </div>

        <div id="domainList"></div>
    </main>
</div>

<!-- ===== 配置可调用模型的遮罩层 ===== -->
<div class="modal-mask" id="bindModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="bindDomainName"
         style="max-width:680px;">
        <div class="modal-head">
            <h3>配置 <span class="mono" id="bindDomainName"></span> 的模型</h3>
            <span class="spacer"></span>
            <button class="ghost btn btn-sm btn-outline-primary" id="bindModalClose">关闭</button>
        </div>
        <div id="bindCardList" class="pick-grid"></div>
        <div id="bindEmpty" class="perm-none" style="margin-top:10px; display:none;"></div>
        <footer class="card-foot">
            <button class="btn btn-primary" id="bindSaveBtn">保存</button>
            <button class="ghost btn btn-sm btn-outline-primary" id="bindClearBtn">清空（置为无可调用）</button>
        </footer>
    </div>
</div>

<!-- ===== 配置 MCP 连接的遮罩层 ===== -->
<div class="modal-mask" id="mcpBindModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mcpBindDomainName"
         style="max-width:680px;">
        <div class="modal-head">
            <h3>配置 <span class="mono" id="mcpBindDomainName"></span> 的 MCP 连接</h3>
            <span class="spacer"></span>
            <button class="ghost btn btn-sm btn-outline-primary" id="mcpBindModalClose">关闭</button>
        </div>
        <div id="mcpBindCardList" class="pick-grid"></div>
        <div id="mcpBindEmpty" class="perm-none" style="margin-top:10px; display:none;"></div>
        <footer class="card-foot">
            <button class="btn btn-primary" id="mcpBindSaveBtn">保存</button>
            <button class="ghost btn btn-sm btn-outline-primary" id="mcpBindClearBtn">全部解绑</button>
        </footer>
    </div>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-domains.js"></script>
</body>
</html>
