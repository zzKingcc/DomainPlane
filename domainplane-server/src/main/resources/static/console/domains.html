<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域空间 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
    <style>
        .dom-icon { width: 17px; height: 17px; flex: 0 0 17px; color: var(--primary); }
        .card-head h2.mono { font-family: ui-monospace, Consolas, monospace; }

        /* 遮罩层里的模型卡片：点一下即选中/取消 */
        .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .pick-card {
            border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
            cursor: pointer; background: var(--card);
        }
        .pick-card:hover { border-color: var(--primary); }
        .pick-card.on { border-color: var(--primary); background: var(--primary-dim); }
        .pick-card .pc-name { font-size: 13.5px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
        .pick-card .pc-note { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
        .pick-card .pc-tags { margin-top: 8px; }

        .tool-tags { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-head">
            <div class="head-line">
                <div>
                    <h2>域空间</h2>
                    <p>一个域一张卡片：配置可调用模型与可见工具。域分两种角色：<b>可调用单元</b>（能作为入口）与<b>装配节点</b>（只把工具 / 提示词 / 模型 / 知识传给后代）。新建域默认无可调用模型。</p>
                </div>
                <span class="count-badge" id="domainCount">—</span>
            </div>
            <div class="actions">
                <input type="text" id="newDomain" placeholder="完整路径域，如 default.customer-service"
                       style="width:240px; font-family:ui-monospace,Consolas,monospace;">
                <!-- nowrap 必须写在这里：label 是 inline-flex，里面的「可调用」是匿名 flex 项，
                     中文可在任意两字间断行，行内空间一紧就会被挤成竖排三个字；
                     flex:0 0 auto 同时禁止这一行把 label 压扁 -->
                <label class="card-note"
                       style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap; flex:0 0 auto;"
                       title="勾选=可调用单元（能作为入口）；不勾选=只做装配，供后代继承工具 / 提示词 / 模型 / 知识">
                    <input type="checkbox" id="newDomainCallable" checked> 可调用
                </label>
                <button id="createDomainBtn">新建域</button>
                <button class="ghost" id="refreshBtn">重新读取</button>
            </div>
        </div>

        <div id="domainList"></div>
    </main>
</div>

<!-- ===== 配置可调用模型的遮罩层 ===== -->
<div class="modal-mask" id="bindModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="bindDomainName"
         style="max-width:680px;">
        <div class="modal-head">
            <h3>配置 <span class="mono" id="bindDomainName"></span> 的可调用模型</h3>
            <span class="spacer"></span>
            <button class="ghost" id="bindModalClose">关闭</button>
        </div>
        <div id="bindCardList" class="pick-grid"></div>
        <div id="bindEmpty" class="perm-none" style="margin-top:10px; display:none;"></div>
        <footer class="card-foot">
            <button id="bindSaveBtn">保存</button>
            <button class="ghost" id="bindClearBtn">清空（置为无可调用）</button>
        </footer>
    </div>
</div>

<script src="assets/console.js"></script>
<script>
    var esc = Console.escapeHtml;

    var DATA = null;             /* /admin/domains */
    var PROFILES = [];           /* /admin/model-profiles */
    var BINDINGS = {};

    /* 遮罩层编辑态：当前域 + 已选别名 */
    var BIND_DOMAIN = '';
    var BIND_PICK = [];

    var DOM_ICON = '<svg class="dom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
        + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>';

    var EP_LABEL = { chat: '对话', embedding: '向量', rerank: '重排', images: '生图',
                     tts: '语音合成', asr: '语音识别', video: '视频' };
    var MOD_LABEL = { text: '文本', image: '图片', audio: '音频', video: '视频',
                      file: '文件', embedding: '向量' };


    function num(n) { return (n == null ? 0 : n); }

    function tagList(list, map) {
        return (list || []).map(function (k) {
            return '<span class="tag public">' + esc(map[k] || k) + '</span>';
        }).join('');
    }

    /* 同名模型（两家服务商各配一份）自动编号：别名 = 模型名[-N]，N 在卡片上显示成 #N */
    function aliasBase(modelName) {
        return (modelName || '').trim().replace(/\s+/g, '-') || 'model';
    }
    function dupNo(p) {
        var base = aliasBase(p.modelName);
        var alias = (p.alias || '').trim();
        if (alias === base) { return 0; }
        var m = alias.match(/-(\d+)$/);
        return (m && alias.slice(0, m.index) === base) ? parseInt(m[1], 10) : 0;
    }
    function modelLabel(p) {
        var n = dupNo(p);
        return (p.modelName || p.alias) + (n > 1 ? ' #' + n : '');
    }

    function sourceTag(d) {
        var s = String((d && d.source) || '').toUpperCase();
        if (s === 'BUILTIN') {
            return '<span class="tag approval" title="根域：整棵域树的起点，不可删除">根域</span>';
        }
        if (s === 'MANUAL') {
            return '<span class="tag perm" title="人工创建，落盘保存，可删除">人工创建</span>';
        }
        return '<span class="tag" title="由工具的域声明派生：声明它的工具被断开后，域仍在，只是暂时没有工具">工具派生</span>';
    }

    function toolTag(t) {
        var cls = 'perm';
        var se = String(t.sideEffect || '').toLowerCase();
        if (se === 'read') { cls = 'read'; }
        else if (se === 'write') { cls = 'write'; }
        else if (se === 'destructive') { cls = 'destructive'; }
        var tip = [esc(t.category || ''), esc(t.provider || ''),
                   t.requiresApproval ? '需人工确认' : ''].filter(Boolean).join(' · ');
        return '<span class="tag ' + cls + '" title="' + tip + '">' + esc(t.name) + '</span>';
    }

    /* 候选：全部「可能走对话」的档案（向量类不能拿去对话；不再有内置 default 这一项）。
       端点族未声明的也要留下 —— 元数据读不出类型的服务商（OpenAI / DeepSeek 官方）就停在这一格，
       滤掉等于一个模型都选不出来。注意 [] 在 JS 里是真值，"有没有声明"必须判长度而不是判真假。 */
    function candidates() {
        var list = [];
        PROFILES.forEach(function (p) {
            if ((p.endpoints || []).length && p.endpoints.indexOf('chat') < 0) { return; }
            var n = dupNo(p);
            list.push({
                alias: p.alias,
                label: modelLabel(p),
                note: p.baseUrl || '',
                tags: tagList(p.endpoints, EP_LABEL) + tagList(p.input, MOD_LABEL)
            });
        });
        return list;
    }

    /* 完整路径 → 从根到自身的链，与服务端 Domains.chainOf 同构 */
    function chainOf(domain) {
        var segs = String(domain || '').split('.');
        var out = [];
        var cur = '';
        for (var i = 0; i < segs.length; i++) {
            cur = cur ? cur + '.' + segs[i] : segs[i];
            out.push(cur);
        }
        return out;
    }

    /* 卡片头部的「是否回写工具执行信息」开关：只渲染在可调用单元（叶子域）上 ——
       装配节点不能作为入口，开关对它没有意义。结构上内层套一个 .tune-switch，
       藏起来的 input 与轨道 / 滑块的样式都挂在那个类上，这里只借它的视觉。 */
    function echoSwitch(d) {
        return '<label class="echo-switch" title="关闭后调用方只收到最终答复，不收到工具调用与执行结果">'
            + '<span class="tune-switch">'
            + '<input type="checkbox" data-echo="' + esc(d.name) + '"'
            + (d.toolCallEcho === true ? ' checked' : '') + '>'
            + '<span class="tune-switch-track"><span class="tune-switch-knob"></span></span>'
            + '</span>'
            + '<span class="echo-switch-label">是否回写工具执行信息</span>'
            + '</label>';
    }

    /* 沿链回落到最近一份绑定（与服务端 resolveAlong 同构）：自身没绑就用祖先的 */
    function resolveBinding(domain) {
        var chain = chainOf(domain);
        for (var i = chain.length - 1; i >= 0; i--) {
            var b = BINDINGS[chain[i]];
            if (b && b.length) { return { aliases: b, source: chain[i] }; }
        }
        return { aliases: [], source: null };
    }

    function render() {
        var box = document.getElementById('domainList');
        var domains = (DATA && DATA.domains) || [];
        document.getElementById('domainCount').textContent = domains.length + ' 个域';

        if (!domains.length) {
            box.innerHTML = '<div class="card"><span class="perm-none">'
                + '当前没有任何域。根域 <span class="mono">default</span> 是整棵域树的起点，'
                + '其余域由上方人工创建或工具声明派生，标识须为从根域出发的完整路径。</span></div>';
            return;
        }

        box.innerHTML = domains.map(function (d) {
            var resolved = resolveBinding(d.name);
            var labels = resolved.aliases.map(function (a) {
                var p = PROFILES.filter(function (x) { return x.alias === a; })[0];
                return p ? modelLabel(p) : a;
            });
            var boundTags = labels.length
                ? labels.map(function (l) { return '<span class="tag public mono">' + esc(l) + '</span>'; }).join(' ')
                    + (resolved.source === d.name ? ''
                        : '<span class="card-note">继承自 ' + esc(resolved.source) + '</span>')
                : '<span class="tag write">无可调用模型</span>';

            var tools = (d.tools || []).map(toolTag).join('');
            var toolLine = tools
                ? '<div class="tool-tags">' + tools + '</div>'
                : '<span class="perm-none">该域没有可见工具</span>';

            return '<section class="card model-card">'
                + '<header class="card-head">'
                +   DOM_ICON
                +   '<h2 class="mono">' + esc(d.name) + '</h2>'
                +   sourceTag(d)
                +   (d.callable
                        ? '<span class="tag read" title="可调用单元：能作为入口被调用">可调用</span>'
                        : '<span class="tag approval" title="装配节点：只把工具 / 提示词 / 模型 / 知识传给后代，不能直接当入口">装配节点</span>')
                +   '<span class="spacer"></span>'
                +   (d.callable ? echoSwitch(d) : '')
                +   '<span class="card-note">工具 ' + num(d.toolCount) + ' · 需确认 '
                +     num(d.approvalCount) + '</span>'
                +   (d.hasChildren
                        ? ''
                        : '<button class="ghost" data-callable="' + esc(d.name) + '" data-to="'
                          + (d.callable ? 'false' : 'true') + '">'
                          + (d.callable ? '设为装配节点' : '设为可调用') + '</button>')
                +   '<button class="ghost" data-cfg="' + esc(d.name) + '">配置模型</button>'
                +   (d.deletable
                        ? '<button class="ghost" data-del="' + esc(d.name) + '">删除</button>'
                        : '')
                + '</header>'
                + (d.hasChildren
                        ? '<div class="card-note" style="margin-top:6px;">'
                          + '该域有子域，按"只有叶子域可作为可调用单元"的规则，它只能作装配节点'
                          + '（把工具 / 提示词 / 模型 / 知识传给后代），不能当入口。需要这一层入口请另建无子域的域。</div>'
                        : '')
                + '<div class="model-meta">'
                +   '<div><span class="k">可调用模型</span>' + boundTags + '</div>'
                +   '<div><span class="k">提示词</span>'
                +     (d.hasPrompt
                        ? '<span class="tag read">' + num(d.promptLength) + ' 字</span>'
                        : '<span class="tag write">缺提示词</span>')
                +   '</div>'
                +   '<div><span class="k">工具</span></div>'
                + '</div>'
                + '<div style="margin-top:8px;">' + toolLine + '</div>'
                + '</section>';
        }).join('');

        box.querySelectorAll('button[data-cfg]').forEach(function (b) {
            b.addEventListener('click', function () { openBind(b.getAttribute('data-cfg')); });
        });
        box.querySelectorAll('button[data-callable]').forEach(function (b) {
            b.addEventListener('click', function () {
                toggleCallable(b.getAttribute('data-callable'),
                    b.getAttribute('data-to') === 'true');
            });
        });
        box.querySelectorAll('button[data-del]').forEach(function (b) {
            b.addEventListener('click', function () { deleteDomain(b.getAttribute('data-del')); });
        });
        box.querySelectorAll('input[data-echo]').forEach(function (input) {
            input.addEventListener('change', function () { saveEcho(input); });
        });
    }

    /* 拨「是否回写工具执行信息」：PUT 落盘，失败把开关弹回原值 */
    function saveEcho(input) {
        var domain = input.getAttribute('data-echo');
        var on = input.checked;
        input.disabled = true;
        Console.jsonRequest('/admin/domains/' + encodeURIComponent(domain) + '/tool-call-echo', 'PUT',
                            { echo: on })
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(Console.sanitizeError(r.detail || r.error) || '保存失败'); }
            })
            .catch(function (e) {
                input.checked = !on;
                alert('保存失败：' + Console.sanitizeError(e.message));
            })
            .then(function () { input.disabled = false; });
    }

    /* ===== 遮罩层：点卡片选模型 ===== */
    function openBind(domain) {
        BIND_DOMAIN = domain;
        BIND_PICK = (BINDINGS[domain] || []).slice();
        document.getElementById('bindDomainName').textContent = domain;
        renderBindCards();
        document.getElementById('bindModal').hidden = false;
        document.body.style.overflow = 'hidden';
    }

    function closeBind() {
        document.getElementById('bindModal').hidden = true;
        document.body.style.overflow = '';
    }

    function renderBindCards() {
        var list = candidates();
        var box = document.getElementById('bindCardList');
        var empty = document.getElementById('bindEmpty');
        if (!list.length) {
            box.innerHTML = '';
            empty.style.display = 'block';
            empty.textContent = '还没有可调用的对话模型 —— 请先到「模型设置」添加。';
            return;
        }
        empty.style.display = 'none';
        box.innerHTML = list.map(function (c) {
            var on = BIND_PICK.indexOf(c.alias) >= 0;
            return '<div class="pick-card' + (on ? ' on' : '') + '" data-pick="' + esc(c.alias) + '">'
                +   '<div class="pc-name">' + esc(c.label) + (on ? ' ✓' : '') + '</div>'
                +   (c.note ? '<div class="pc-note mono">' + esc(c.note) + '</div>' : '')
                +   (c.tags ? '<div class="pc-tags">' + c.tags + '</div>' : '')
                + '</div>';
        }).join('');
        box.querySelectorAll('div[data-pick]').forEach(function (card) {
            card.addEventListener('click', function () {
                var a = card.getAttribute('data-pick');
                var i = BIND_PICK.indexOf(a);
                if (i >= 0) { BIND_PICK.splice(i, 1); } else { BIND_PICK.push(a); }
                renderBindCards();
            });
        });
    }

    function saveBind(aliases) {
        Console.jsonRequest('/admin/model-bindings/' + encodeURIComponent(BIND_DOMAIN), 'PUT',
                            { aliases: aliases })
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(Console.sanitizeError(r.detail || r.error) || '设置失败'); }
                closeBind();
                loadBindings();
            })
            .catch(function (e) { alert('设置失败：' + e.message); });
    }

    function createDomain() {
        var input = document.getElementById('newDomain');
        var id = (input.value || '').trim();
        if (!id) { alert('请先填写域标识'); input.focus(); return; }
        var callable = document.getElementById('newDomainCallable').checked;
        Console.jsonRequest('/admin/domains', 'POST', { id: id, callable: callable })
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(Console.sanitizeError(r.detail || r.error) || '创建失败'); }
                input.value = '';
                load();
            })
            .catch(function (e) { alert('创建失败：' + e.message); });
    }

    /* 切换可调用性：只影响这一个域，不向下传播 */
    function toggleCallable(id, callable) {
        var tip = callable
            ? '把 ' + id + ' 设为可调用单元？之后它可以作为入口被调用。'
            : '把 ' + id + ' 设为装配节点？之后它不能再作为入口，'
                + '只给后代提供工具 / 提示词 / 模型 / 知识。';
        if (!confirm(tip)) { return; }
        Console.jsonRequest('/admin/domains/' + encodeURIComponent(id) + '/callable', 'PUT',
                            { callable: callable })
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(Console.sanitizeError(r.detail || r.error) || '切换失败'); }
                load();
            })
            .catch(function (e) { alert('切换失败：' + e.message); });
    }

    function deleteDomain(id) {
        var ok = confirm('确认删除域 ' + id + '？\n\n'
            + '· 会递归删除它的全部子域\n'
            + '· 绑定该域的调用方会在启动校验或首次调用时报「域不存在」\n'
            + '· 该域及其子域的知识库索引与切片预览文件会被删除\n'
            + '· 该域及其子域的提示词、模型绑定、工具声明记录会一并清理');
        if (!ok) { return; }
        Console.jsonRequest('/admin/domains/' + encodeURIComponent(id), 'DELETE')
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(Console.sanitizeError(r.detail || r.error) || '删除失败'); }
                load();
            })
            .catch(function (e) { alert('删除失败：' + e.message); });
    }

    function loadBindings() {
        return Console.request('/admin/model-profiles').then(function (r) {
            PROFILES = (r && r.profiles) || [];
            BINDINGS = (r && r.domainBindings) || {};
            render();
        }).catch(function (e) {
            document.getElementById('domainList').innerHTML =
                '<div class="card" style="color:var(--red);">模型列表加载失败：' + esc(e.message) + '</div>';
        });
    }

    function load() {
        document.getElementById('domainList').innerHTML =
            '<div class="card"><span class="perm-none">加载中…</span></div>';
        Console.request('/admin/domains').then(function (r) {
            DATA = r || {};
            return loadBindings();
        }).catch(function (e) {
            document.getElementById('domainList').innerHTML =
                '<div class="card" style="color:var(--red);">读取失败：' + esc(e.message) + '</div>';
        });
    }

    document.getElementById('createDomainBtn').addEventListener('click', createDomain);
    document.getElementById('newDomain').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { createDomain(); }
    });
    document.getElementById('refreshBtn').addEventListener('click', load);

    document.getElementById('bindModalClose').addEventListener('click', closeBind);
    document.getElementById('bindSaveBtn').addEventListener('click', function () {
        saveBind(BIND_PICK.slice());
    });
    document.getElementById('bindClearBtn').addEventListener('click', function () {
        saveBind([]);
    });
    document.getElementById('bindModal').addEventListener('click', function (e) {
        if (e.target === document.getElementById('bindModal')) { closeBind(); }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !document.getElementById('bindModal').hidden) { closeBind(); }
    });

    Console.renderSidebar('domains');
    Console.ready(load);
</script>
</body>
</html>
