<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div class="page-head">
                <h2>账号</h2>
            </div>
        </div>
        <div class="page-body dp-account">

            <!-- 总览行：四件"一眼要看"的事实都是账号页自己的口径（密码状态 / 最近登录 / 来源 / 记录数），
                 账号名交给下面的账号卡——同一份 /admin/session 数据，不重复摆两遍。 -->
            <div class="row row-cards row-deck">
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-amber">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">密码状态</div>
                                <div class="dp-stat-value" id="statPwd">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-purple">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">最近登录</div>
                                <div class="dp-stat-value" id="statLast">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-blue">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">登录来源</div>
                                <div class="dp-stat-value mono" id="statFrom">—</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card card-sm dp-stat">
                        <div class="card-body dp-stat-body">
                            <div class="dp-stat-icon dp-stat-icon-pink">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7.5V12l3.5 2"/></svg>
                            </div>
                            <div class="dp-stat-info">
                                <div class="dp-stat-label">登录记录</div>
                                <div class="dp-stat-value" id="statRecords">—</div>
                                <div class="dp-stat-note">最多保留 20 条</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 账号卡：头像 + 账号名 + 两个状态 chip + 账号文件（事实，不是说明）。
                 改密码是这一页唯一的写操作，放在卡头右侧，点了才弹遮罩层。 -->
            <div class="card dp-panel">
                <div class="card-body">
                    <div class="dp-op-head">
                        <span class="dp-op-icon dp-op-icon-blue">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <h3>账号信息</h3>
                        <span class="spacer"></span>
                        <button class="btn btn-sm btn-primary" id="openPwdBtn">修改密码</button>
                    </div>
                    <div class="dp-ac-profile">
                        <span class="dp-ac-avatar" id="acAvatar">—</span>
                        <div class="dp-ac-id">
                            <div class="dp-ac-name" id="acName">—</div>
                            <div class="dp-ac-chips" id="acChips"></div>
                            <div class="dp-ac-file" id="acFile">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 登录记录：定高滚动表，空态 / 加载态画在表体内，卡片尺寸恒定 -->
            <div class="card dp-panel dp-doc-card">
                <div class="card-body">
                    <div class="dp-op-head">
                        <span class="dp-op-icon dp-op-icon-teal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </span>
                        <h3>登录记录</h3>
                        <span class="spacer"></span>
                        <span class="mbadge" id="loginCount">—</span>
                    </div>
                    <div class="dp-doc-scroll dp-ac-log-scroll">
                        <table class="table dp-doc-table">
                            <thead>
                            <tr>
                                <th style="width:34%">登录时间</th>
                                <th>来源 IP</th>
                            </tr>
                            </thead>
                            <tbody id="loginBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- ===== 修改密码遮罩层 =====
     一年点不到几次的写操作，不占页面常驻位置；代价写在这一行黄条里：
     改密码会换掉签名密钥，当前这次登录也会失效。 -->
<div class="modal-mask" id="pwdModal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pwdModalTitle"
         style="max-width:480px;">
        <div class="modal-head">
            <h3 id="pwdModalTitle">修改密码</h3>
            <span class="spacer"></span>
            <button class="modal-close" id="pwdModalClose" aria-label="关闭">×</button>
        </div>

        <div class="dp-ac-warn">保存后签名密钥随之更换，当前登录与全部旧凭证立即失效，需用新密码重新登录。</div>

        <div class="field">
            <label for="oldPassword">当前密码</label>
            <input class="form-control" id="oldPassword" type="password" autocomplete="current-password">
        </div>
        <div class="field">
            <label for="newPassword">新密码</label>
            <input class="form-control" id="newPassword" type="password" autocomplete="new-password">
            <div class="help">不超过 72 字节</div>
        </div>
        <div class="field">
            <label for="newPassword2">确认新密码</label>
            <input class="form-control" id="newPassword2" type="password" autocomplete="new-password">
        </div>

        <div class="result" id="pwdResult"></div>
        <footer class="card-foot">
            <span class="spacer"></span>
            <button class="btn btn-outline-secondary" id="clearPwdBtn">清空</button>
            <button class="btn btn-primary" id="savePwdBtn">保存并生效</button>
        </footer>
    </div>
</div>

<script src="assets/console.js"></script>
<script src="assets/page-account.js"></script>
</body>
</html>
