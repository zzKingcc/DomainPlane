<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
    <style>
        /* 登录页是独立入口：不带侧栏（未登录时不加载一堆无权限的导航与请求） */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card { width: 100%; max-width: 380px; }
        .login-card .brand-line { margin-bottom: 18px; }
        .login-card .brand-line h1 { font-size: 17px; font-weight: 600; }
        .login-card .brand-line .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
        .login-card form { display: block; }
        .login-card .btn-primary { width: 100%; margin-top: 4px; }
        .login-note { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 14px; }
        .login-note code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; }
        .banner { font-size: 12.5px; line-height: 1.7; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
        .banner.warn { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
        .banner.info { background: var(--primary-dim); color: var(--primary); border: 1px solid #bfdbfe; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card card">
        <div class="brand-line">
            <h1>DomainPlane 管控台</h1>
            <div class="sub" id="modeSub">正在检测服务端状态…</div>
        </div>

        <div id="banner" class="banner info" style="display:none;"></div>

        <form id="loginForm" autocomplete="off" onsubmit="return false;">
            <div class="field">
                <label for="username">账号</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="服务端配置的账号">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="登录密码">
            </div>
            <div class="field" id="confirmField" style="display:none;">
                <label for="password2">确认密码</label>
                <input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="再输一遍">
            </div>
            <div class="result" id="result"></div>
            <button class="btn-primary" id="submitBtn" type="submit">登录</button>
        </form>

        <div class="login-note" id="note"></div>
    </div>
</div>

<script>
    /* 登录页自身不能跑登录守卫（否则永远进不来）。必须在引入 console.js 之前置位。 */
    window.CONSOLE_NO_AUTH_GUARD = true;
</script>
<script src="assets/console.js"></script>
<script>
    var mode = 'login';           /* login | init | blocked */
    var resultEl = document.getElementById('result');
    var bannerEl = document.getElementById('banner');
    var noteEl = document.getElementById('note');
    var submitBtn = document.getElementById('submitBtn');

    function showResult(msg, ok) {
        resultEl.textContent = msg;
        resultEl.className = 'result show ' + (ok ? 'ok' : 'err');
    }

    function showBanner(msg, kind) {
        bannerEl.textContent = msg;
        bannerEl.className = 'banner ' + (kind || 'info');
        bannerEl.style.display = 'block';
    }

    function enterConsole() {
        location.replace('overview.html');
    }

    function applyMode(s) {
        if (s.initialized && s.authenticated) {
            enterConsole();
            return;
        }
        if (s.corrupted) {
            /* 账号文件存在但读不出来：服务端拒绝一切受保护请求，初始化入口也已关闭
               （账号数据就在文件里，允许重新初始化等于允许接管）。这里只告知，不给任何入口。
               ⚠️ 这一页是<b>未鉴权</b>的：不能出现任何凭证明文，也不能出现"删某个文件、重启后会怎样"
               这类运维内部操作指引，登录页是公开面，写在这里等于把它送给任何能打开浏览器的人。 */
            mode = 'blocked';
            document.getElementById('modeSub').textContent = '账号文件损坏，服务无法鉴权';
            document.getElementById('confirmField').style.display = 'none';
            document.getElementById('password').disabled = true;
            document.getElementById('password2').disabled = true;
            submitBtn.disabled = true;
            submitBtn.textContent = '不可用';
            noteEl.textContent = '服务端读不出账号文件，因此拒绝一切受保护请求，初始化入口也已关闭。'
                + '请联系部署方处理后重启服务。';
            return;
        }
        if (!s.initialized) {
            /* 无账号 = 连种子都没有：开放初始化入口（有账号后本入口永久关闭） */
            mode = 'init';
            document.getElementById('modeSub').textContent = '首次初始化：设置管理员账号';
            document.getElementById('confirmField').style.display = 'block';
            submitBtn.textContent = '完成初始化';
            noteEl.textContent = '当前服务端还没有账号，这里设置的账号密码将成为唯一的管控台账号。'
                + '本入口只在无账号时开放，之后永久关闭，也不存在注册与找回。';
        } else {
            mode = 'login';
            document.getElementById('modeSub').textContent = '登录以进入管控台';
            document.getElementById('confirmField').style.display = 'none';
            submitBtn.textContent = '登录';
            noteEl.textContent = '本产品不提供注册与密码找回。忘记密码请联系部署方处理。';
            if (s.defaultCredential) {
                /* 只说"还是初始密码"，<b>不说初始密码是什么</b>。这一页未鉴权，
                   把凭据写在页面上等于公开。初始值由部署方从部署文档/种子文件自行掌握。 */
                showBanner('当前仍在使用初始密码，建议尽快修改。是否修改由部署方决定。', 'warn');
            }
        }
        document.getElementById('username').value = s.username || '';
        document.getElementById('password').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', function () {
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var password2 = document.getElementById('password2').value;

        if (mode === 'blocked') { return; }
        if (!username) { showResult('账号不能为空', false); return; }
        if (!password) { showResult('密码不能为空', false); return; }
        if (mode === 'init' && password !== password2) {
            showResult('两次输入的密码不一致', false);
            return;
        }

        submitBtn.disabled = true;
        showResult(mode === 'init' ? '正在初始化…' : '正在登录…', true);

        var path = mode === 'init' ? '/admin/init' : '/admin/login';
        Console.jsonRequest(path, 'POST', { username: username, password: password })
            .then(function (r) {
                if (r && r.defaultCredential) {
                    try { sessionStorage.setItem('domainplane.defaultCredential', '1'); } catch (e) { }
                }
                showResult((r && r.message) || '登录成功，正在进入管控台…', true);
                /* ⚠️ 服务端说"成功"不等于浏览器把 Cookie 存下了：跨站响应里的 Set-Cookie 会被直接丢弃，
                   于是出现"登录成功 + 随后每个接口都 401「未携带凭证」"这种最容易被误判成服务端 bug 的现象。
                   这里用 /admin/session 复核一次，把问题在源头点破，而不是跳进一个必然 401 的页面。 */
                return Console.request('/admin/session').then(function (s) {
                    if (s && s.authenticated) {
                        enterConsole();
                        return;
                    }
                    submitBtn.disabled = false;
                    Console.warnIfCrossOrigin();
                    showResult('账号密码校验通过，但浏览器没有保存登录凭证（Cookie）。'
                        + '管控台必须从服务端自己的地址打开：'
                        + Console.baseUrl() + '/admin.html', false);
                });
            })
            .catch(function (e) {
                submitBtn.disabled = false;
                showResult(e.message, false);
            });
    });

    /* 不同源打开时先在页面上说明（此时连登录都不会生效），避免只留一行服务端日志 */
    Console.warnIfCrossOrigin();

    Console.request('/admin/session').then(applyMode).catch(function (e) {
        document.getElementById('modeSub').textContent = '无法连接服务端';
        showResult(e.message, false);
    });
</script>
</body>
</html>
