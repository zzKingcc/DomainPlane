<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · DomainPlane 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body class="dp-login">
<!-- 登录页是独立入口：不带侧栏（未登录时不加载一堆无权限的导航与请求）。
     骨架走 Tabler 官方 sign-in：.page.page-center 纵向居中 + .container-tight 窄栏
     + 表单本身就是 .card.card-md（.form-footer 里的按钮 w-100 撑满）。
     不写 .container —— 本地这份 tabler 压根没有 .container 规则（只有 .toast-container），
     挂上去是个死类；窄栏全靠 .container-tight（自带 margin-inline:auto + max-width:32rem）。 -->
<div class="page page-center">
    <div class="container-tight py-4">

        <div class="text-center mb-4">
            <div class="dp-login-brand">DomainPlane</div>
            <div class="text-muted" id="modeSub">正在检测服务端状态…</div>
        </div>

        <div id="banner" class="banner info" hidden></div>

        <form id="loginForm" class="card card-md" autocomplete="off" onsubmit="return false;">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">登录管控台</h2>
                <div class="mb-3">
                    <label class="form-label" for="username">账号</label>
                    <input class="form-control" id="username" name="username" type="text"
                           autocomplete="username" placeholder="服务端配置的账号">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-control" id="password" name="password" type="password"
                           autocomplete="current-password" placeholder="登录密码">
                </div>
                <!-- 仅首次初始化时出现：无账号状态下才有的"设密码"入口 -->
                <div class="mb-3" id="confirmField" hidden>
                    <label class="form-label" for="password2">确认密码</label>
                    <input class="form-control" id="password2" name="password2" type="password"
                           autocomplete="new-password" placeholder="再输一遍">
                </div>
                <div class="result" id="result"></div>
                <div class="form-footer">
                    <button class="btn btn-primary w-100" id="submitBtn" type="submit">登录</button>
                </div>
            </div>
        </form>

        <div class="text-center text-muted mt-3" id="note"></div>
    </div>
</div>

<script>
    /* 登录页自身不能跑登录守卫（否则永远进不来）。必须在引入 console.js 之前置位。 */
    window.CONSOLE_NO_AUTH_GUARD = true;
</script>
<script src="assets/console.js"></script>
<script src="assets/page-login.js"></script>
</body>
</html>
