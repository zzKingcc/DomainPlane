<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-label="知识检索：按知识体隔离，沿域链召回">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #0f172a; }
      .m { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #64748b; }
      .mono { font-family: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .kb { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.5; }
      .acc { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
      .none { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1100" height="580" fill="#ffffff"/>
  <text class="t" x="40" y="44" font-size="20" font-weight="700">检索：能查什么由域链定，查在哪由知识体定</text>
  <text class="m" x="40" y="70" font-size="13">这两件事必须分开。合在一起，就会出现"子域上传的文档写进父域的库，用户看不出来"。</text>

  <text class="m" x="40" y="100" font-size="12" font-weight="600">检索域 = 自身 + 祖先</text>
  <text class="m" x="290" y="100" font-size="12" font-weight="600">域绑的知识体（纯查表，不继承）</text>
  <text class="m" x="700" y="100" font-size="12" font-weight="600">召回 → 融合 → 注入</text>

  <rect class="acc" x="40" y="110" width="210" height="52" rx="8"/>
  <text class="t mono" x="56" y="132" font-size="11">…customer.aftersale</text>
  <text class="m" x="56" y="150" font-size="10">depth 0 · 本轮入口</text>

  <rect class="box" x="40" y="174" width="210" height="52" rx="8"/>
  <text class="t mono" x="56" y="196" font-size="11">default.customer</text>
  <text class="m" x="56" y="214" font-size="10">depth 1</text>

  <rect class="none" x="40" y="238" width="210" height="52" rx="8"/>
  <text class="t mono" x="56" y="260" font-size="11">default</text>
  <text class="m" x="56" y="278" font-size="10">未绑体 → 这一层不出通道</text>

  <rect class="kb" x="290" y="110" width="370" height="96" rx="8"/>
  <text class="t" x="306" y="132" font-size="12" font-weight="600">kb-aftersale</text>
  <text class="m" x="306" y="152" font-size="10">向量 → qdrant-vec　　关键字 → es-main</text>
  <text class="m mono" x="306" y="172" font-size="9.5">domainplane_kb_aftersale-kb_1a2b3c4d</text>
  <text class="m" x="306" y="192" font-size="10">原文落点 → local 或 s3 连接</text>

  <rect class="kb" x="290" y="222" width="370" height="96" rx="8"/>
  <text class="t" x="306" y="244" font-size="12" font-weight="600">kb-order</text>
  <text class="m" x="306" y="264" font-size="10">只有关键字槽 → es-main（单路召回）</text>
  <text class="m mono" x="306" y="284" font-size="9.5">domainplane_kb_order-kb_9f8e7d6c</text>
  <text class="m" x="306" y="304" font-size="10">多个域可绑同一个体 → 共用同一索引，不复制</text>

  <rect class="panel" x="290" y="336" width="370" height="52" rx="8"/>
  <text class="m" x="306" y="358" font-size="10.5">一个域只绑一个体；没绑 → 这个域既不检索，</text>
  <text class="m" x="306" y="375" font-size="10.5">也不下发检索工具（静默关闭，不报错）。</text>

  <line x1="250" y1="136" x2="284" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="250" y1="200" x2="284" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect class="box" x="700" y="110" width="360" height="60" rx="8"/>
  <text class="t" x="716" y="132" font-size="11.5" font-weight="600">通道并发召回</text>
  <text class="m" x="716" y="152" font-size="10">每个体每路一条通道；单路超时只废这一路</text>

  <rect class="box" x="700" y="188" width="360" height="76" rx="8"/>
  <text class="t" x="716" y="210" font-size="11.5" font-weight="600">自适应融合</text>
  <text class="m" x="716" y="230" font-size="10">单来源 → 分数制（同一索引内 BM25 才可比）</text>
  <text class="m" x="716" y="247" font-size="10">多来源 → RRF + 层级衰减（跨索引的分数不可比）</text>

  <rect class="acc" x="700" y="282" width="360" height="66" rx="8"/>
  <text class="t" x="716" y="304" font-size="11.5" font-weight="600">注入这一轮上下文</text>
  <text class="m" x="716" y="324" font-size="10">前 8 片、正文 ≤ 3000 字符（首条必留）</text>
  <text class="m" x="716" y="340" font-size="10">标题命中 / 文件名命中走乘法增益</text>

  <line x1="660" y1="150" x2="694" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="660" y1="256" x2="694" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="880" y1="170" x2="880" y2="184" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="880" y1="264" x2="880" y2="278" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect class="panel" x="40" y="410" width="1020" height="118" rx="10"/>
  <text class="t" x="60" y="434" font-size="12" font-weight="600">为什么这样就不会串数据</text>
  <text class="m" x="60" y="458" font-size="11">① 索引名 = 前缀 + 知识体 slug + 8 位哈希，建体时算好就冻结；之后改名、换连接、换绑定都不动它。</text>
  <text class="m" x="60" y="478" font-size="11">② 检索请求不带域过滤条件——查错体等于查了另一个索引，结果是"查不到"，而不是"查到别人的"。</text>
  <text class="m" x="60" y="498" font-size="11">③ 切片原文与原始文件落在体的原文落点（本地盘或 S3），索引是可重建的派生数据：</text>
  <text class="m" x="60" y="516" font-size="11">　　换落点 = 在新连接上从原文写满 → 校验条数 → 才切指针，旧集合留着不删。</text>

  <text class="m" x="40" y="556" font-size="10">唯一要记的代价：索引名人不可读。排障靠知识库页反查，不能靠肉眼认。</text>
</svg>
