<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 596" width="1100" height="596" role="img" aria-label="十一个模块的分层与依赖方向">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <style>
      .t { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #0f172a; }
      .m { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #64748b; }
      .ask { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .sv { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
      .sdk { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.5; }
      .core { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1100" height="596" fill="#ffffff"/>
  <text class="t" x="40" y="44" font-size="20" font-weight="700">十一个模块，两条线</text>
  <text class="m" x="40" y="70" font-size="13">两条线只在 api 这一个点相接——SDK 不依赖 domain / runtime 任何一行，服务端也不认识 SDK 的类，两侧只靠 HTTP 报文说话。</text>

  <line x1="24" y1="548" x2="24" y2="116" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text class="m" x="40" y="576" font-size="11">依赖只向上：server → { runtime , infrastructure } → domain → common → api</text>

  <rect class="sv" x="40" y="100" width="660" height="78" rx="10"/>
  <text class="t mono" x="60" y="126" font-size="13" font-weight="600">domainplane-server</text>
  <text class="m" x="60" y="146" font-size="11">装配 · Controller · 鉴权 · 模型层 · MCP · 管控台静态资源 · 7 个后台任务</text>
  <text class="m" x="60" y="164" font-size="11">唯一可执行产物：domainplane-v1.0.jar</text>
  <text class="ask" x="682" y="146" font-size="10.5" text-anchor="end">谁来装配、谁能调</text>

  <rect class="box" x="40" y="196" width="320" height="88" rx="10"/>
  <text class="t mono" x="60" y="222" font-size="13" font-weight="600">domainplane-runtime</text>
  <text class="m" x="60" y="242" font-size="11">编排图 · 上下文装配 · 工具路由</text>
  <text class="m" x="60" y="260" font-size="11">取消与流注册 · 能力工具 binder</text>
  <text class="ask" x="342" y="260" font-size="10.5" text-anchor="end">这一轮怎么走</text>

  <rect class="box" x="380" y="196" width="320" height="88" rx="10"/>
  <text class="t mono" x="400" y="222" font-size="13" font-weight="600">domainplane-infrastructure</text>
  <text class="m" x="400" y="242" font-size="11">ES / Qdrant 适配 · Redis 三类存储</text>
  <text class="m" x="400" y="260" font-size="11">8 种格式摄取与切片</text>
  <text class="ask" x="682" y="260" font-size="10.5" text-anchor="end">怎么读写外部</text>

  <text class="m" x="40" y="304" font-size="10">runtime 与 infrastructure 是兄弟：都只依赖 domain，互不依赖——所以换掉 ES、走上 Qdrant 时，编排内核一行不用改。</text>

  <rect class="box" x="40" y="314" width="660" height="76" rx="10"/>
  <text class="t mono" x="60" y="340" font-size="13" font-weight="600">domainplane-domain</text>
  <text class="m" x="60" y="360" font-size="11">纯领域：记忆双约束 · 检索计划与通道 · 分数制 / RRF 融合</text>
  <text class="m" x="60" y="378" font-size="11">存储 SPI（KnowledgeBackend 的三件套 · BlobStore）</text>
  <text class="ask" x="682" y="360" font-size="10.5" text-anchor="end">算出来是什么</text>

  <rect class="box" x="40" y="406" width="660" height="64" rx="10"/>
  <text class="t mono" x="60" y="430" font-size="13" font-weight="600">domainplane-common</text>
  <text class="m" x="60" y="452" font-size="11">异常体系 · 输入清洗 · CJK 度量 · 原子落盘</text>

  <rect class="box" x="40" y="488" width="660" height="64" rx="10"/>
  <text class="t mono" x="60" y="512" font-size="13" font-weight="600">domainplane-api</text>
  <text class="m" x="60" y="534" font-size="11">AgentService · AgentEvent · 四条工具注解 · ErrorCode（60 条）· 域与索引名规则</text>
  <text class="ask" x="682" y="534" font-size="10.5" text-anchor="end">两边认同一份类型</text>

  <rect class="sdk" x="760" y="196" width="300" height="56" rx="10"/>
  <text class="t mono" x="778" y="220" font-size="12" font-weight="600">sdk-core</text>
  <text class="m" x="778" y="240" font-size="10.5">server / username / password</text>

  <rect class="sdk" x="760" y="270" width="300" height="56" rx="10"/>
  <text class="t mono" x="778" y="294" font-size="12" font-weight="600">client-core</text>
  <text class="m" x="778" y="314" font-size="10.5">WebClient · 凭证缓存 · 错误翻译</text>

  <rect class="sdk" x="760" y="344" width="145" height="56" rx="10"/>
  <text class="t mono" x="776" y="368" font-size="11.5" font-weight="600">chat-client</text>
  <text class="m" x="776" y="387" font-size="10">对话 / 审批 / 停止</text>

  <rect class="sdk" x="915" y="344" width="145" height="56" rx="10"/>
  <text class="t mono" x="931" y="368" font-size="11.5" font-weight="600">kb-client</text>
  <text class="m" x="931" y="387" font-size="10">上传 / 列表 / 删除</text>

  <rect class="sdk" x="760" y="418" width="300" height="56" rx="10"/>
  <text class="t mono" x="778" y="442" font-size="11.5" font-weight="600">tool-provider</text>
  <text class="m" x="778" y="462" font-size="10.5">反向注册 · 5s 心跳 · 回调执行</text>

  <line x1="910" y1="252" x2="910" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="832" y1="326" x2="832" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="988" y1="326" x2="988" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>

  <path d="M760,224 L720,224 L720,180" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a2t)"/>
  <text class="m" x="760" y="176" font-size="10.5" fill="#0f766e">只走 HTTP / SSE</text>

  <text class="m" x="760" y="500" font-size="10" >SDK 线也依赖 api（只取类型与注解），</text>
  <text class="m" x="760" y="516" font-size="10">但 tool-provider 只依赖 sdk-core。</text>
  <text class="m" x="760" y="540" font-size="10">接入方三行配置即可启动；工具实例</text>
  <text class="m" x="760" y="556" font-size="10">另需 tools=true 与 instance-id。</text>
</svg>
