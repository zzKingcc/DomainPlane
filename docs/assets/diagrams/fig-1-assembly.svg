<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="一轮对话的装配路径">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #0f172a; }
      .m { font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; fill: #64748b; }
      .mono { font-family: "JetBrains Mono","Cascadia Mono",Consolas,monospace; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .accent { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
      .teal { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.5; }
      .amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1100" height="650" fill="#ffffff"/>
  <text class="t" x="40" y="46" font-size="20" font-weight="700">一轮对话的装配路径</text>
  <text class="m" x="40" y="72" font-size="13">带域进来 → 沿链取能力 → 进图执行 → 事件流回传。装配发生在每一次请求，不是启动时算一次。</text>

  <!-- Stage 1 -->
  <rect class="box" x="40" y="100" width="200" height="96" rx="10"/>
  <text class="t" x="60" y="130" font-size="14" font-weight="600">① HTTP 请求</text>
  <text class="m mono" x="60" y="154" font-size="11">POST /api/agent/chat</text>
  <text class="m" x="60" y="174" font-size="11">domain / sessionId / 问题</text>

  <!-- Stage 2 -->
  <rect class="accent" x="290" y="100" width="230" height="96" rx="10"/>
  <text class="t" x="310" y="130" font-size="14" font-weight="600">② 域链解析</text>
  <text class="m" x="310" y="154" font-size="11">从自身向上取到根域</text>
  <text class="m" x="310" y="174" font-size="11">可调用性 / 软删 / 版本校验</text>

  <!-- Stage 3 -->
  <rect class="teal" x="570" y="100" width="240" height="96" rx="10"/>
  <text class="t" x="590" y="130" font-size="14" font-weight="600">③ 四维能力装配</text>
  <text class="m" x="590" y="154" font-size="11">工具 · 知识 · 提示词 · 模型</text>
  <text class="m" x="590" y="174" font-size="11">三累加 + 一就近覆盖</text>

  <!-- Stage 4 -->
  <rect class="amber" x="860" y="100" width="200" height="96" rx="10"/>
  <text class="t" x="880" y="130" font-size="14" font-weight="600">④ 编排图执行</text>
  <text class="m" x="880" y="154" font-size="11">agent ⇄ tools</text>
  <text class="m" x="880" y="174" font-size="11">审批点可中断</text>

  <line x1="240" y1="148" x2="284" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="148" x2="564" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="148" x2="854" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Domain chain detail -->
  <rect class="panel" x="40" y="228" width="1020" height="150" rx="12"/>
  <text class="m" x="60" y="256" font-size="12" font-weight="600">域链（示例）</text>

  <rect class="box" x="60" y="272" width="190" height="52" rx="8"/>
  <text class="t mono" x="76" y="296" font-size="12">default</text>
  <text class="m" x="76" y="314" font-size="10">根域 · 提示词基底</text>

  <rect class="box" x="290" y="272" width="220" height="52" rx="8"/>
  <text class="t mono" x="306" y="296" font-size="12">default.customer</text>
  <text class="m" x="306" y="314" font-size="10">装配节点 · 绑主模型</text>

  <rect class="accent" x="550" y="272" width="270" height="52" rx="8"/>
  <text class="t mono" x="566" y="296" font-size="12">default.customer.aftersale</text>
  <text class="m" x="566" y="314" font-size="10">可调用叶子 · 本轮入口</text>

  <line x1="250" y1="298" x2="284" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="298" x2="544" y2="298" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="box" x="850" y="264" width="190" height="68" rx="8"/>
  <text class="m" x="866" y="286" font-size="11">工具：祖先声明即可见</text>
  <text class="m" x="866" y="304" font-size="11">知识：只向上召回</text>
  <text class="m" x="866" y="322" font-size="11">模型：最近绑定胜出</text>

  <!-- Graph -->
  <rect class="panel" x="40" y="402" width="1020" height="128" rx="12"/>
  <text class="m" x="60" y="428" font-size="12" font-weight="600">编排图（LangGraph4j）</text>

  <rect class="box" x="80" y="444" width="150" height="56" rx="8"/>
  <text class="t" x="112" y="468" font-size="13" font-weight="600">agent</text>
  <text class="m" x="96" y="488" font-size="10">调模型 / 吐 TOKEN</text>

  <rect class="amber" x="300" y="444" width="150" height="56" rx="8"/>
  <text class="t" x="330" y="468" font-size="13" font-weight="600">review</text>
  <text class="m" x="314" y="488" font-size="10">审批中断锚点</text>

  <rect class="box" x="520" y="444" width="150" height="56" rx="8"/>
  <text class="t" x="552" y="468" font-size="13" font-weight="600">tools</text>
  <text class="m" x="536" y="488" font-size="10">本地 / 远程 / MCP</text>

  <line x1="230" y1="462" x2="294" y2="462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="462" x2="514" y2="462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M595,500 C595,530 155,530 155,504" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="m" x="340" y="524" font-size="10">有工具调用就循环，直到模型不再要工具</text>

  <text class="m" x="720" y="466" font-size="11">无审批 → 直接进 tools</text>
  <text class="m" x="720" y="486" font-size="11">有审批 → 停在 review 前，发 INTERRUPT</text>
  <text class="m" x="720" y="506" font-size="11">resume 从断点续跑，不重放已花掉的钱</text>

  <!-- SSE -->
  <rect class="box" x="40" y="552" width="1020" height="66" rx="10"/>
  <text class="t" x="60" y="578" font-size="13" font-weight="600">SSE 事件流</text>
  <text class="m mono" x="60" y="600" font-size="11">TOKEN · THINKING · PLAN · TOOL_CALL · TOOL_RESULT · INTERRUPT · STOPPED · ERROR · DONE</text>
  <text class="m" x="820" y="600" font-size="10">终止事件只有三个：DONE / STOPPED / ERROR</text>
</svg>
