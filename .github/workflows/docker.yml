# 镜像构建与发布（打 tag 才触发）
#
# Dockerfile 的约定是"jar 与 Dockerfile 同目录"，所以这里先 package 再搬 jar 进构建上下文。
# 推到 GHCR 用 GITHUB_TOKEN，不需要额外配仓库 secret。
name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/domainplane-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 打包
        run: mvn -B -ntp -DskipTests package

      - name: 准备构建上下文
        # 只搬 server 的 jar：镜像里不需要其他模块的产物
        run: cp domainplane-server/target/domainplane-*.jar ./domainplane-server.jar

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
